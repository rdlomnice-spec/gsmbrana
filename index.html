<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GSM Brána</title>

<style>
*{box-sizing:border-box}

body{
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;
 background:#f4f4f4;
 margin:0;
 padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px;
}

.container{
 max-width:480px;
 margin:auto;
}

.card{
 background:#fff;
 padding:10px;
 border-radius:12px;
 margin-bottom:10px;
}

/* pokoj */
.room-inline{
 display:flex;
 align-items:center;
 gap:8px;
}
.room-inline select{width:56px}

/* základ */
input,select{
 width:100%;
 min-width:0;
 max-width:100%;
 font-size:14px;
 border-radius:10px;
 border:1px solid #ccc;
 display:block;
}

/* ✅ hlavní rozdělení */
.grid-main{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}

.col{
 display:flex;
 flex-direction:column;
 min-width:0;
 overflow:hidden;
}

/* ✅ DATE (native safe) */
input[type="date"]{
 height:42px;
 padding:0 10px;
 width:100%;
 max-width:100%;
 background:#fff;
}

/* ✅ TIME */
.field{
 position:relative;
 margin-top:6px;
}

.field span{
 position:absolute;
 left:10px;
 top:50%;
 transform:translateY(-50%);
 pointer-events:none;
}

.field select{
 height:42px;
 padding-left:34px;
}

/* label */
label{
 font-size:12px;
 color:#555;
 display:block;
 margin-top:6px;
}

/* tlačítka */
button{
 width:100%;
 padding:12px;
 margin-top:6px;
 font-size:15px;
 border-radius:10px;
 border:none;
 background:#2c3e50;
 color:#fff;
}

/* výstup */
pre{
 background:#fafafa;
 padding:8px;
 margin-top:6px;
 border-radius:10px;
 font-size:12px;
 height:34px;
 overflow-x:auto;
 white-space:nowrap;
}

/* tabulka */
.table-wrap{overflow-x:auto}

table{
 min-width:540px;
 width:100%;
 border-collapse:collapse;
 font-size:12px;
}

col.pos{width:48px}
col.room{width:36px}
col.phone{width:auto}
col.date{width:90px}

th,td{
 padding:6px;
 border-bottom:1px solid #eee;
}

.center{text-align:center}

td.phone{
 text-align:left;
 white-space:nowrap;
}

td.date{
 text-align:left;
 line-height:1.3;
}

.highlight{background:#d1f2d1}

.note{
 font-size:11px;
 color:#c0392b;
 text-align:center;
 margin-top:6px;
}
</style>
</head>

<body>

<div class="container">

<h2>GSM Brána</h2>

<!-- INPUTY -->
<div class="card">

<div class="room-inline">
<label>Pokoj</label>
<select id="room">
<option>1</option><option>2</option><option>3</option>
<option>4</option><option>5</option>
</select>
</div>

<label>Telefon</label>
<input id="phone" type="tel" placeholder="+420...">

<label>Pozice v modulu</label>
<select id="position"></select>

</div>

<!-- DATUM + ČAS -->
<div class="card">

<div class="grid-main">

<!-- ZAČÁTEK -->
<div class="col">

<label>📅 Začátek parkování</label>
<input type="date" id="dateFrom">

<div class="field">
<span>🕐</span>
<select id="hourFrom"></select>
</div>

</div>

<!-- KONEC -->
<div class="col">

<label>📅 Konec parkování</label>
<input type="date" id="dateTo">

<div class="field">
<span>🕐</span>
<select id="hourTo"></select>
</div>

</div>

</div>

</div>

<!-- GENEROVÁNÍ -->
<div class="card">
<button onclick="generate()">Generovat příkaz</button>
<button onclick="sendSMS()">Odeslat SMS</button>
<pre id="output"></pre>
</div>

<!-- TABULKA -->
<div class="card">
<h3>Přehled pozic</h3>

<div class="table-wrap">
<table id="table">
<colgroup>
<col class="pos">
<col class="room">
<col class="phone">
<col class="date">
<col class="date">
</colgroup>
</table>
</div>

<div class="note">⚠️ Data nejsou synchronizovaná</div>
</div>

</div>

<script>
const gate="+420725582214";

/* pozice */
for(let i=150;i<=160;i++){
 position.innerHTML+=`<option>${i}</option>`;
}

/* hodiny */
for(let i=0;i<24;i++){
 let h=i.toString().padStart(2,'0');
 hourFrom.innerHTML+=`<option value="${h}">${h}:00</option>`;
 hourTo.innerHTML+=`<option value="${h}">${h}:00</option>`;
}

/* validace */
function validatePhone(){
 let v=phone.value.replace(/\s/g,'');
 if(/^\+\d{6,15}$/.test(v)||/^00\d{6,15}$/.test(v)){
  phone.style.border="2px solid green"; return true;
 }
 phone.style.border="2px solid red"; return false;
}
phone.addEventListener("input",validatePhone);

/* formát */
function format(d,h){
 let x=new Date(d+"T"+h+":00");
 return x.getFullYear().toString().slice(2)+
 ("0"+(x.getMonth()+1)).slice(-2)+
 ("0"+x.getDate()).slice(-2)+h+"00";
}

function makeDate(d,h){
 return new Date(d+"T"+h+":00");
}

function niceDate(s){
 if(!s)return "-";
 return `${s.slice(4,6)}.${s.slice(2,4)}.20${s.slice(0,2)}<br>${s.slice(6,8)}:${s.slice(8,10)}`;
}

function norm(p){
 p=p.replace(/\s/g,'');
 if(p.startsWith("+")) return "00"+p.slice(1);
 return p;
}

/* generování */
function generate(){

 if(!validatePhone()) return alert("Špatné číslo");
 if(!dateFrom.value||!dateTo.value) return alert("Vyplň datumy");

 let from=makeDate(dateFrom.value,hourFrom.value);
 let to=makeDate(dateTo.value,hourTo.value);

 if(to<from) return alert("Konec nesmí být před začátkem");

 let f=format(dateFrom.value,hourFrom.value);
 let t=format(dateTo.value,hourTo.value);

 let sms=`1234A${position.value}#${norm(phone.value)}#${f}#${t}#`;
 output.innerText=sms;

 localStorage.setItem("pos_"+position.value,norm(phone.value));
 localStorage.setItem("room_"+position.value,room.value);
 localStorage.setItem("from_"+position.value,f);
 localStorage.setItem("to_"+position.value,t);

 loadTable(position.value);
}

/* SMS */
function sendSMS(){
 if(!output.innerText) return alert("Nejdříve generuj");
 location.href=`sms:${gate}?body=${encodeURIComponent(output.innerText)}`;
}

/* tabulka */
function loadTable(active=null){
 table.innerHTML="<tr><th class='center'>Poz</th><th class='center'>Pokoj</th><th>Telefon</th><th>Příjezd</th><th>Odjezd</th></tr>";

 for(let i=150;i<=160;i++){
  let c=(i==active)?"highlight":"";

  table.innerHTML+=`
  <tr class="${c}">
  <td class="center">${i}</td>
  <td class="center">${localStorage.getItem("room_"+i)||"-"}</td>
  <td class="phone">${localStorage.getItem("pos_"+i)||"-"}</td>
  <td class="date">${niceDate(localStorage.getItem("from_"+i))}</td>
  <td class="date">${niceDate(localStorage.getItem("to_"+i))}</td>
  </tr>`;
 }
}

loadTable();
</script>

</body>
</html>
