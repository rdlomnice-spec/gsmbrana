<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GSM Brána</title>

<link rel="manifest" href="manifest.json">

<style>
body {
    font-family: -apple-system, Arial;
    margin: 0;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
    background: #f7f7f7;
}

.container {
    max-width: 420px;
    margin: auto;
}

input, select, button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid #ccc;
}

button {
    background: #2c3e50;
    color: white;
    border: none;
}

pre {
    background: #fff;
    padding: 12px;
    margin-top: 12px;
    border-radius: 10px;
    word-break: break-all;
}

table {
    width: 100%;
    margin-top: 20px;
    background: white;
    border-radius: 10px;
    overflow: hidden;
}

td, th {
    padding: 8px;
    text-align: center;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

<h2>GSM Brána</h2>

<input 
    type="tel" 
    id="phone" 
    list="contacts" 
    placeholder="+420123456789 nebo 00420123456789"
    inputmode="tel"
    autocomplete="tel"
    autofocus
>

<datalist id="contacts"></datalist>

<select id="position"></select>

<button onclick="generate()">Vytvořit SMS</button>
<button onclick="sendSMS()">Odeslat SMS</button>

<pre id="output"></pre>

<h3>Pozice 150–160</h3>
<table id="table"></table>

</div>

<script>
// ✅ Service Worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}

const gateNumber = "+420725582214";

// ✅ pozice
for (let i = 150; i <= 160; i++) {
    let opt = document.createElement("option");
    opt.value = i;
    opt.text = i;
    document.getElementById("position").appendChild(opt);
}

// ===== kontakty =====
function loadContacts() {
    let contacts = JSON.parse(localStorage.getItem("contacts")) || [];
    let dl = document.getElementById("contacts");
    dl.innerHTML = "";
    contacts.forEach(c => {
        dl.innerHTML += `<option value="${c}">`;
    });
}

function saveContact(phone) {
    let contacts = JSON.parse(localStorage.getItem("contacts")) || [];

    if (!contacts.includes(phone)) {
        contacts.push(phone);
        localStorage.setItem("contacts", JSON.stringify(contacts));
    }
}

// ✅ Android fix – reaguje i na našeptávač
const phoneInput = document.getElementById("phone");
phoneInput.addEventListener("input", () => validatePhone(phoneInput));
phoneInput.addEventListener("change", () => validatePhone(phoneInput));

// ===== tabulka =====
function loadTable() {
    let table = document.getElementById("table");
    table.innerHTML = "<tr><th>Pozice</th><th>Číslo</th><th>Datum</th></tr>";

    for (let i = 150; i <= 160; i++) {
        let num = localStorage.getItem("pos_" + i) || "-";
        let date = localStorage.getItem("date_" + i) || "-";

        table.innerHTML += `
        <tr>
            <td>${i}</td>
            <td>${num}</td>
            <td>${date}</td>
        </tr>`;
    }
}

// ===== čas =====
function getNow() {
    return new Date().toLocaleString("cs-CZ");
}

// ===== validace =====
function validatePhone(input) {
    let cleaned = input.value.replace(/\s/g, '');

    if (cleaned.match(/^\+\d{6,15}$/) || cleaned.match(/^00\d{6,15}$/)) {
        input.style.border = "2px solid green";
        return true;
    } else {
        input.style.border = "2px solid red";
        return false;
    }
}

// ===== normalizace =====
function normalizePhone(phone) {
    phone = phone.replace(/\s+/g, "");

    if (phone.startsWith("+")) {
        return "00" + phone.slice(1);
    }

    return phone;
}

// ===== generování =====
function generate() {
    let phone = phoneInput.value.trim();
    let pos = document.getElementById('position').value;

    if (!validatePhone(phoneInput)) {
        alert("Číslo musí začínat + nebo 00");
        return;
    }

    let normalized = normalizePhone(phone);
    let sms = `1234A${pos}#${normalized}#`;

    document.getElementById("output").innerText = sms;

    localStorage.setItem("pos_" + pos, normalized);
    localStorage.setItem("date_" + pos, getNow());

    saveContact(phone);
    loadTable();
    loadContacts();
}

// ===== odeslání =====
function sendSMS() {
    let smsText = document.getElementById("output").innerText;

    if (!smsText) {
        alert("Nejdříve vytvoř SMS");
        return;
    }

    window.location.href =
        `sms:${gateNumber}?body=${encodeURIComponent(smsText)}`;
}

// ✅ autofocus fix pro Android
window.addEventListener("load", () => {
    setTimeout(() => phoneInput.focus(), 300);
});

// init
loadTable();
loadContacts();

</script>

</body>
</html>
