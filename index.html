<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GSM Brána</title>

<style>
body {
    font-family: -apple-system, Arial;
    margin: 0;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
    background: #f7f7f7;
}

.container {
    max-width: 420px;
    margin: auto;
}

input, select, button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    font-size: 16px;
    border-radius: 10px;
}

button {
    background: #2c3e50;
    color: white;
    border: none;
}

pre {
    background: #fff;
    padding: 12px;
    margin-top: 12px;
    border-radius: 10px;
    word-break: break-all;
}

table {
    width: 100%;
    margin-top: 20px;
    background: white;
    border-radius: 10px;
    overflow: hidden;
}

td, th {
    padding: 8px;
    text-align: center;
    font-size: 13px;
}

</style>
</head>
<body>

<div class="container">

<h2>GSM Brána</h2>

<input 
    type="text" 
    id="phone" 
    list="contacts" 
    placeholder="+420123456789" 
    autofocus
>

<datalist id="contacts"></datalist>

<select id="position"></select>

<button onclick="generate()">Vytvořit SMS</button>
<button onclick="sendSMS()">Odeslat SMS</button>

<pre id="output"></pre>

<h3>Pozice 170–180</h3>
<table id="table"></table>

</div>

<script>
const gateNumber = "+420725582214";

// vytvoření pozic
for (let i = 170; i <= 180; i++) {
    let opt = document.createElement("option");
    opt.value = i;
    opt.text = i;
    document.getElementById("position").appendChild(opt);
}

// načtení kontaktů
function loadContacts() {
    let contacts = JSON.parse(localStorage.getItem("contacts")) || [];
    let datalist = document.getElementById("contacts");
    datalist.innerHTML = "";

    contacts.forEach(c => {
        datalist.innerHTML += `<option value="${c}">`;
    });
}

// uložení kontaktu
function saveContact(phone) {
    let contacts = JSON.parse(localStorage.getItem("contacts")) || [];

    if (!contacts.includes(phone)) {
        contacts.push(phone);
        localStorage.setItem("contacts", JSON.stringify(contacts));
    }
}

// načtení tabulky
function loadTable() {
    let table = document.getElementById("table");
    table.innerHTML = "<tr><th>Pozice</th><th>Číslo</th><th>Datum</th></tr>";

    for (let i = 170; i <= 180; i++) {
        let num = localStorage.getItem("pos_" + i) || "-";
        let date = localStorage.getItem("date_" + i) || "-";

        table.innerHTML += `
        <tr>
            <td>${i}</td>
            <td>${num}</td>
            <td>${date}</td>
        </tr>`;
    }
}

// formát času
function getNow() {
    let now = new Date();
    return now.toLocaleString("cs-CZ");
}

// normalizace
function normalizePhone(phone) {
    phone = phone.replace(/\s+/g, "");

    if (phone.startsWith("+")) return "00" + phone.slice(1);
    if (phone.startsWith("420")) return "00420" + phone.slice(3);
    return phone;
}

// generování SMS
function generate() {
    let phone = document.getElementById('phone').value.trim();
    let pos = document.getElementById('position').value;

    if (!phone.match(/^\+?\d{9,15}$/)) {
        alert("Neplatné číslo");
        return;
    }

    let normalized = normalizePhone(phone);
    let sms = `1234A${pos}#${normalized}#`;

    document.getElementById("output").innerText = sms;

    // uložit číslo + čas
    localStorage.setItem("pos_" + pos, normalized);
    localStorage.setItem("date_" + pos, getNow());

    // uložit do kontaktů
    saveContact(phone);

    loadTable();
    loadContacts();
}

// odeslání
function sendSMS() {
    let smsText = document.getElementById("output").innerText;

    if (!smsText) {
        alert("Nejdříve vytvoř SMS");
        return;
    }

    window.location.href =
        `sms:${gateNumber}?body=${encodeURIComponent(smsText)}`;
}

// init
loadTable();
loadContacts();

</script>

</body>
</html>
