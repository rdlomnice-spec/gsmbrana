<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GSM Brána</title>

<style>
    body {
        font-family: -apple-system, Arial;
        margin: 0;
        padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
        background: #f7f7f7;
    }

    .container {
        max-width: 420px;
        margin: auto;
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    input, select, button {
        width: 100%;
        padding: 14px;
        margin-top: 12px;
        font-size: 16px;
        border-radius: 10px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }

    button {
        background: #2c3e50;
        color: white;
        border: none;
    }

    button:active {
        background: #1f2d3a;
    }

    pre {
        background: #fff;
        padding: 12px;
        margin-top: 12px;
        border-radius: 10px;
        word-break: break-all;
    }

    table {
        width: 100%;
        margin-top: 20px;
        border-collapse: collapse;
        background: white;
        border-radius: 10px;
        overflow: hidden;
    }

    td, th {
        border-bottom: 1px solid #eee;
        padding: 10px;
        text-align: center;
        font-size: 14px;
    }

    tr:last-child td {
        border-bottom: none;
    }
</style>
</head>
<body>

<div class="container">

<h2>GSM Brána</h2>

<input type="text" id="phone" placeholder="+420123456789">

<select id="position"></select>

<button onclick="generate()">Vytvořit SMS</button>
<button onclick="sendSMS()">Odeslat SMS</button>

<pre id="output"></pre>

<h3>Pozice 170–180</h3>
<table id="table">
<tr><th>Pozice</th><th>Číslo</th></tr>
</table>

</div>

<script>
const gateNumber = "+420725582214";

// pozice
for (let i = 170; i <= 180; i++) {
    let opt = document.createElement("option");
    opt.value = i;
    opt.text = i;
    document.getElementById("position").appendChild(opt);
}

// načtení tabulky
function loadTable() {
    let table = document.getElementById("table");
    table.innerHTML = "<tr><th>Pozice</th><th>Číslo</th></tr>";

    for (let i = 170; i <= 180; i++) {
        let num = localStorage.getItem("pos_" + i) || "-";

        table.innerHTML += `<tr>
            <td>${i}</td>
            <td>${num}</td>
        </tr>`;
    }
}

// normalizace čísla
function normalizePhone(phone) {
    phone = phone.replace(/\s+/g, "");

    if (phone.startsWith("+")) return "00" + phone.substring(1);
    if (phone.startsWith("420")) return "00420" + phone.substring(3);
    if (phone.startsWith("00420")) return phone;

    return phone;
}

// generování SMS
function generate() {
    let phone = document.getElementById('phone').value.trim();
    let pos = document.getElementById('position').value;

    if (!phone.match(/^\+?\d{9,15}$/)) {
        alert("Neplatné číslo");
        return;
    }

    let normalized = normalizePhone(phone);
    let sms = `1234A${pos}#${normalized}#`;

    document.getElementById("output").innerText = sms;

    localStorage.setItem("pos_" + pos, normalized);
    loadTable();
}

// odeslání SMS
function sendSMS() {
    let smsText = document.getElementById("output").innerText;

    if (!smsText) {
        alert("Nejdříve vytvoř SMS");
        return;
    }

    window.location.href =
        `sms:${gateNumber}?body=${encodeURIComponent(smsText)}`;
}

loadTable();
</script>

</body>
</html>
