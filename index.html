<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GSM Brána</title>

<style>
* { box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px;
}

.container { max-width: 480px; margin: auto; }

.card {
    background: #fff;
    padding: 10px;
    border-radius: 12px;
    margin-bottom: 10px;
}

.room-inline {
    display: flex;
    align-items: center;
    gap: 8px;
}
.room-inline select {
    width: 56px;
    padding: 6px;
}

input, select {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    font-size: 14px;
    border-radius: 10px;
    border: 1px solid #ccc;
}

input[type="date"] {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    min-height: 40px;
}

.row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

label {
    font-size: 12px;
    color: #555;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    font-size: 15px;
    border-radius: 10px;
    border: none;
    background: #2c3e50;
    color: white;
}

pre {
    background: #fafafa;
    padding: 8px;
    margin-top: 6px;
    border-radius: 10px;
    font-size: 12px;
    height: 34px;
    overflow-x: auto;
    white-space: nowrap;
    color: #888;
    font-family: monospace;
}

.table-wrap { overflow-x: auto; }

table {
    min-width: 540px;
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}

col.pos   { width: 48px; }
col.room  { width: 36px; }
col.phone { width: auto; }
col.date  { width: 90px; }

th, td {
    padding: 6px;
    border-bottom: 1px solid #eee;
}

.center { text-align: center; }

td.phone {
    text-align: left;
    white-space: nowrap;
}

td.date {
    text-align: left;
    line-height: 1.3;
}

.highlight { background: #d1f2d1; }

.note {
    font-size: 11px;
    color: #c0392b;
    text-align: center;
    margin-top: 6px;
}
</style>
</head>

<body>

<div class="container">

<h2>GSM Brána</h2>

<div class="card">

<div class="room-inline">
<label>Pokoj</label>
<select id="room">
<option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
</select>
</div>

<label>Telefon</label>
<input id="phone" type="tel" placeholder="+420..." inputmode="tel">

<label>Pozice v modulu</label>
<select id="position"></select>

</div>

<div class="card">
<div class="row2">

<div>
<label>Začátek parkování</label>
<input type="date" id="dateFrom">
<select id="hourFrom"></select>
</div>

<div>
<label>Konec parkování</label>
<input type="date" id="dateTo">
<select id="hourTo"></select>
</div>

</div>
</div>

<div class="card">
<button onclick="generate()">Generovat příkaz</button>
<button onclick="sendSMS()">Odeslat SMS</button>
<pre id="output"></pre>
</div>

<div class="card">
<h3>Přehled pozic</h3>

<div class="table-wrap">
<table id="table">
<colgroup>
<col class="pos">
<col class="room">
<col class="phone">
<col class="date">
<col class="date">
</colgroup>
</table>
</div>

<div class="note">
⚠️ Data nejsou synchronizovaná s bránou – pouze v telefonu
</div>
</div>

</div>

<script>
const gate = "+420725582214";

// pozice
for (let i=150;i<=160;i++) {
    position.innerHTML+=`<option>${i}</option>`;
}

// ✅ HODINY S IKONOU
for (let i=0;i<24;i++){
 let h = i.toString().padStart(2,'0');
 let label = "🕐 " + h + ":00";
 hourFrom.innerHTML += `<option value="${h}">${label}</option>`;
 hourTo.innerHTML   += `<option value="${h}">${label}</option>`;
}

// validace telefonu
function validatePhone(){
 let v=phone.value.replace(/\s/g,'');
 if (/^\+\d{6,15}$/.test(v)||/^00\d{6,15}$/.test(v)){
   phone.style.border="2px solid green";
   return true;
 }
 phone.style.border="2px solid red";
 return false;
}
phone.addEventListener("input",validatePhone);

// format SMS
function format(d,h){
 let x=new Date(d+"T"+h+":00");
 return x.getFullYear().toString().slice(2)+
 ("0"+(x.getMonth()+1)).slice(-2)+
 ("0"+x.getDate()).slice(-2)+h+"00";
}

function niceDate(str){
 if(!str) return "-";
 return `${str.slice(4,6)}.${str.slice(2,4)}.20${str.slice(0,2)}<br>${str.slice(6,8)}:${str.slice(8,10)}`;
}

function makeDate(d,h){ return new Date(d+"T"+h+":00"); }

function norm(p){
 p=p.replace(/\s/g,'');
 if(p.startsWith("+")) return "00"+p.slice(1);
 return p;
}

function generate(){

 if(!validatePhone()){
   alert("Číslo musí začínat + nebo 00");
   return;
 }

 if(!dateFrom.value||!dateTo.value){
   alert("Vyplň datumy");
   return;
 }

 let from=makeDate(dateFrom.value,hourFrom.value);
 let to=makeDate(dateTo.value,hourTo.value);

 if(to<from){
   alert("Konec parkování nesmí být dříve než začátek");
   return;
 }

 let f=format(dateFrom.value,hourFrom.value);
 let t=format(dateTo.value,hourTo.value);

 let sms=`1234A${position.value}#${norm(phone.value)}#${f}#${t}#`;

 output.innerText=sms;

 localStorage.setItem("pos_"+position.value,norm(phone.value));
 localStorage.setItem("room_"+position.value,room.value);
 localStorage.setItem("from_"+position.value,f);
 localStorage.setItem("to_"+position.value,t);

 loadTable(position.value);
}

function sendSMS(){
 if(!output.innerText){
   alert("Nejdříve vygeneruj příkaz");
   return;
 }
 location.href=`sms:${gate}?body=${encodeURIComponent(output.innerText)}`;
}

function loadTable(active=null){
 table.innerHTML =
 "<tr><th class='center'>Poz</th><th class='center'>Pokoj</th><th>Telefon</th><th>Příjezd</th><th>Odjezd</th></tr>";

 for(let i=150;i<=160;i++){
  let c=(i==active)?"highlight":"";
  table.innerHTML+=`
  <tr class="${c}">
  <td class="center">${i}</td>
  <td class="center">${localStorage.getItem("room_"+i)||"-"}</td>
  <td class="phone">${localStorage.getItem("pos_"+i)||"-"}</td>
  <td class="date">${niceDate(localStorage.getItem("from_"+i))}</td>
  <td class="date">${niceDate(localStorage.getItem("to_"+i))}</td>
  </tr>`;
 }
}

loadTable();
</script>

</body>
</html>
